	<style>
		/* Game Modal Styles */
		.game-modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0, 0, 0, 0.95);
			justify-content: center;
			align-items: center;
			z-index: 999999;
			overflow: auto;
		}

		/* Fullscreen CSS */
		.game-modal.fullscreen {
			background: #000;
		}

		.game-modal.fullscreen .game-modal-content {
			max-width: 100vw;
			width: 100vw;
			height: 100vh;
			border-radius: 0;
			padding: 0;
			border: none;
		}

		.game-modal.fullscreen .game-modal-frame {
			width: 100%;
			height: 100vh;
			border: none;
			border-radius: 0;
			margin: 0;
		}

		.game-modal.fullscreen .game-modal-title,
		.game-modal.fullscreen .game-modal-controls,
		.game-modal.fullscreen .game-modal-close {
			display: none;
		}

		.game-modal-content {
			background: var(--bg);
			max-width: 90vw;
			width: 900px;
			border-radius: 20px;
			padding: 1.5rem;
			display: flex;
			flex-direction: column;
			align-items: center;
			position: relative;
			box-shadow: 0 0 25px var(--uibg);
			text-align: center;
			border: 2px solid var(--inputborder);
		}

		.game-modal-title {
			margin: 0 0 1rem;
			color: var(--textcolor);
			font-size: 2rem;
			text-shadow: var(--shadow);
		}

		.game-modal-frame {
			width: 100%;
			height: 60vh;
			border: 3px solid var(--uibg);
			border-radius: 10px;
			margin-bottom: 1rem;
			background: var(--bg);
		}

		.game-modal-controls {
			display: flex;
			gap: 1rem;
			flex-wrap: wrap;
			justify-content: center;
			margin-bottom: 0.5rem;
		}

		.game-modal-controls button {
			background: var(--uibg);
			border: 2px solid var(--inputborder);
			border-radius: 10px;
			color: var(--textcolor);
			padding: 0.8rem 1.2rem;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.3s;
			box-shadow: var(--shadow);
		}

		.game-modal-controls button:hover {
			transform: scale(1.05);
			filter: brightness(85%);
		}

		.game-modal-close {
			position: absolute;
			top: 15px;
			right: 15px;
			background: var(--uibg);
			border: 2px solid var(--inputborder);
			border-radius: 50%;
			color: var(--textcolor);
			width: 40px;
			height: 40px;
			font-size: 1.5rem;
			font-weight: bold;
			line-height: 1;
			cursor: pointer;
			z-index: 1000;
			transition: all 0.3s;
			box-shadow: var(--shadow);
		}

		.game-modal-close:hover {
			transform: scale(1.1);
			filter: brightness(80%);
		}

		/* Draggable Exit Button */
		.draggable-exit-btn {
			position: fixed;
			left: 12px;
			bottom: 12px;
			z-index: 1000001;
			padding: 8px 14px;
			font-size: 14px;
			background: rgba(0,0,0,0.35);
			color: white;
			border: 1px solid rgba(255,255,255,0.25);
			border-radius: 6px;
			cursor: grab;
			user-select: none;
			opacity: 0.4;
			transition: opacity 0.2s, background 0.2s;
			display: none;
		}

		.draggable-exit-btn:hover {
			opacity: 1;
			background: rgba(0,0,0,0.65);
		}

		.draggable-exit-btn.dragging {
			cursor: grabbing;
		}

		.game-modal.fullscreen ~ .draggable-exit-btn {
			display: block;
		}
	</style>
	
	<script>
		$.getJSON("data/changelog.json", (data) => {
			const storedVersion = sessionStorage.getItem("selenite.version") || "";
			if (storedVersion != data.version) {
				toast({ title: "New Update!", message: data.desc, time: data.timestamp });
				sessionStorage.setItem("selenite.version", data.version);
			}
		});
		
		function toast(message, type) {
			const toast = document.getElementById("toast");
			toast.innerHTML = `<div class=samerow><h1>${message.title} - ${timeAgo(new Date(message.time * 1000))}</h1></div><p>${message.message}</p>`;
			toast.style.animation = "toastFade 6s";
		}

		function timeAgo(input) {
			const date = input instanceof Date ? input : new Date(input);
			const formatter = new Intl.RelativeTimeFormat("en");
			const ranges = {
				years: 3600 * 24 * 365,
				months: 3600 * 24 * 30,
				weeks: 3600 * 24 * 7,
				days: 3600 * 24,
				hours: 3600,
				minutes: 60,
				seconds: 1,
			};
			const secondsElapsed = (date.getTime() - Date.now()) / 1000;
			for (let key in ranges) {
				if (ranges[key] < Math.abs(secondsElapsed)) {
					const delta = secondsElapsed / ranges[key];
					return formatter.format(Math.round(delta), key);
				}
			}
		}
	</script>

<script>
// Load apps into the apps section
function loadAppsSection() {
	$.getJSON("/data/apps.json", function (data) {
		$("#apps #appsmessage").remove();
		data.sort((a, b) => a.name.localeCompare(b.name));
		
		for (let i = 0; i < data.length; i++) {
			let $element = $("<a>")
				.attr({
					class: "game app-item",
					id: "app-" + data[i].directory,
					href: "sppa/" + data[i].directory + "/index.html",
				})
				.append(
					$("<img>").prop({
						src: "sppa/" + data[i].directory + "/" + data[i].image,
						alt: data[i].name + " logo",
					})
				)
				.append($("<h1>").text(data[i].name));

			$("#apps").append($element);
		}
		
		updateSearchPlaceholder();
	});
}

// Update search placeholder with total count
function updateSearchPlaceholder() {
	setTimeout(function() {
		const gamesCount = $("#games .game").not(".suggest").length;
		const appsCount = $("#apps .app-item").length;
		const total = gamesCount + appsCount;
		$("#gamesearch").prop({
			placeholder: "Click here to search through our " + total + " games & apps!"
		});
	}, 100);
}

// Auto-load apps when page loads
$(document).ready(function() {
	loadAppsSection();
	
	// Extend search functionality to include apps
	$("#gamesearch").on("input", function() {
		var txt = $(this).val();
		
		// Handle games
		if (txt == "") {
			$("#games .suggest").css("display", "inline-block");
			$("#games .game").css("display", "inline-block");
		} else {
			$("#games .suggest").css("display", "none");
			$("#games .game").each(function () {
				if ($(this).text().toUpperCase().indexOf(txt.toUpperCase()) != -1 || 
				    $(this).attr("id").toUpperCase().indexOf(txt.toUpperCase()) != -1) {
					$(this).css("display", "inline-block");
				} else {
					$(this).css("display", "none");
				}
			});
		}
		
		// Handle apps
		$("#apps .app-item").each(function () {
			if (txt == "" || 
			    $(this).text().toUpperCase().indexOf(txt.toUpperCase()) != -1 || 
			    $(this).attr("id").toUpperCase().indexOf(txt.toUpperCase()) != -1) {
				$(this).css("display", "inline-block");
			} else {
				$(this).css("display", "none");
			}
		});
	});
});

// Game Modal Functionality
(function () {
	'use strict';

	const gameModal = document.getElementById('gameModal');
	const gameFrame = document.getElementById('gameFrame');
	const gameTitle = document.getElementById('gameTitle');
	const closeModal = document.getElementById('closeModal');
	const fullscreenBtn = document.getElementById('fullscreenBtn');
	const aboutBlankBtn = document.getElementById('aboutBlankBtn');
	const blobBtn = document.getElementById('blobBtn');
	const exitBtn = document.getElementById('exitBtn');
	
	let currentGameUrl = '';
	let currentGameTitle = '';

	// Close modal
	function closeGameModal() {
		gameModal.style.display = "none";
		gameModal.classList.remove('fullscreen');
		gameFrame.src = "about:blank";
	}

	closeModal.onclick = closeGameModal;

	// Click outside modal to close (only when not fullscreen)
	gameModal.onclick = function(e) {
		if (e.target === gameModal && !gameModal.classList.contains('fullscreen')) {
			closeGameModal();
		}
	};

	// Open game in modal
	function openGameModal(url, title) {
		currentGameUrl = url;
		currentGameTitle = title;
		gameFrame.src = url;
		gameTitle.textContent = title;
		gameModal.style.display = "flex";
		// Don't auto-fullscreen - show the popup menu first
	}

	// Fullscreen button - now uses CSS fullscreen with exit button
	fullscreenBtn.onclick = function() {
		gameModal.classList.add('fullscreen');
	};

	// About:blank
	aboutBlankBtn.onclick = function() {
		const newWindow = window.open("about:blank", "_blank");
		if (newWindow) {
			fetch(currentGameUrl)
				.then(r => r.text())
				.then(html => {
					// Use correct base path for resolving relative assets
					const normalized = new URL(currentGameUrl, location.href).href;
					const baseDir = normalized.split('/').slice(0, -1).join('/') + '/';
					const baseTag = `<base href="${baseDir}">`;
					
					// Inject base tag into head - try multiple patterns
					if (html.match(/<head([^>]*)>/i)) {
						html = html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
					} else if (html.match(/<html([^>]*)>/i)) {
						html = html.replace(/<html([^>]*)>/i, `<html$1><head>${baseTag}</head>`);
					} else {
						html = `<head>${baseTag}</head>` + html;
					}
					
					newWindow.document.write(html);
					newWindow.document.close();
				})
				.catch(err => {
					console.error("Error:", err);
					alert("Failed to open in about:blank");
				});
		} else {
			alert("Popup blocked!");
		}
	};

	// Blob URL
blobBtn.onclick = function() {
		const html = `
			<!DOCTYPE html>
			<html>
			<head>
				<style>
					body, html {
						margin: 0;
						padding: 0;
						width: 100%;
						height: 100%;
						overflow: hidden;
					}
					iframe {
						width: 100%;
						height: 100%;
						border: none;
					}
				</style>
			</head>
			<body>
				<iframe src="${currentGameUrl}"></iframe>
			</body>
			</html>
		`;
		const blob = new Blob([html], { type: "text/html" });
		const blobUrl = URL.createObjectURL(blob);
		window.open(blobUrl, "_blank");
	};

	// Draggable Exit Button Logic
	let dragging = false;
	let moved = false;
	let startX = 0, startY = 0, offsetX = 0, offsetY = 0;

	exitBtn.addEventListener('mousedown', e => {
		dragging = true;
		moved = false;
		startX = e.clientX;
		startY = e.clientY;
		const rect = exitBtn.getBoundingClientRect();
		offsetX = e.clientX - rect.left;
		offsetY = e.clientY - rect.top;
		exitBtn.classList.add('dragging');
		e.preventDefault();
	});

	document.addEventListener('mousemove', e => {
		if (!dragging) return;
		const dx = Math.abs(e.clientX - startX);
		const dy = Math.abs(e.clientY - startY);
		if (dx > 4 || dy > 4) moved = true;
		exitBtn.style.left = (e.clientX - offsetX) + 'px';
		exitBtn.style.top = (e.clientY - offsetY) + 'px';
		exitBtn.style.bottom = 'auto';
	});

	document.addEventListener('mouseup', () => {
		if (!dragging) return;
		dragging = false;
		exitBtn.classList.remove('dragging');
	});

	exitBtn.addEventListener('click', e => {
		if (moved) {
			e.preventDefault();
			e.stopPropagation();
			return;
		}
		// Exit fullscreen and go back to launch menu
		gameModal.classList.remove('fullscreen');
	});

	// Backtick key (`) to close modal or exit fullscreen
	document.addEventListener('keydown', e => {
		if (e.key === '`' && gameModal.style.display === 'flex') {
			if (gameModal.classList.contains('fullscreen')) {
				// Exit fullscreen and go back to launch menu
				gameModal.classList.remove('fullscreen');
			} else {
				// Close the modal completely
				closeGameModal();
			}
		}
	});

	// Intercept clicks on game/app links
	document.addEventListener('click', function (e) {
		let target = e.target;
		while (target && target.tagName !== 'A') {
			target = target.parentElement;
		}

		if (target && target.tagName === 'A' && target.href) {
			// Check if it's a game or app link
			const isGame = target.classList.contains('game');
			const isApp = target.classList.contains('app-item');
			
			// Skip external links
			const isExternal = target.href.startsWith('http') && !target.href.includes(window.location.hostname);
			
			// Skip hash links and blank links
			const isHashOrBlank = target.href.includes('#') || target.id === 'blank';
			
			// Skip suggest link
			const isSuggest = target.querySelector('.suggest') !== null;
			
			if ((isGame || isApp) && !isExternal && !isHashOrBlank && !isSuggest) {
				e.preventDefault();
				e.stopPropagation();
				
				// Get game/app title
				const titleElement = target.querySelector('h1');
				const title = titleElement ? titleElement.textContent : 'Game';
				
				openGameModal(target.href, title);
			}
		}
	}, true);

})();

// Original blob overlay for header/footer links
(function () {
	'use strict';

	document.addEventListener('DOMContentLoaded', function () {
		document.addEventListener('click', function (e) {
			let target = e.target;
			while (target && target.tagName !== 'A') {
				target = target.parentElement;
			}

			if (target && target.tagName === 'A' && target.href) {
				// Only handle header/footer links
				const isHeaderFooterLink = target.closest('header') || target.closest('footer');
				
				// Skip external links (Discord, GitHub, Google Forms, etc.)
				const isExternal = target.href.startsWith('http') && !target.href.includes(window.location.hostname);
				
				// Skip hash links and blank links
				const isHashOrBlank = target.href.includes('#') || target.id === 'blank';
				
				if (isHeaderFooterLink && !isExternal && !isHashOrBlank) {
					e.preventDefault();
					e.stopPropagation();
					openGameInBlob(target.href);
				}
			}
		}, true);
	});

	async function openGameInBlob(gameUrl) {
		let blobUrl, overlay, exitBtn;

		const loadingDiv = document.createElement('div');
		loadingDiv.textContent = 'Loading...';
		loadingDiv.style.cssText = `
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 999998;
			padding: 20px;
			background: rgba(0,0,0,0.8);
			color: white;
			border-radius: 10px;
			font-size: 18px;
		`;
		document.body.appendChild(loadingDiv);

		try {
			const response = await fetch(gameUrl);
			let html = await response.text();

			// Use correct base path for resolving relative assets
			const normalized = new URL(gameUrl, location.href).href;
			const baseDir = normalized.split('/').slice(0, -1).join('/') + '/';
			const baseTag = `<base href="${baseDir}">`;

			const injector = `
<script>
document.addEventListener('keydown', e => {
	if (e.key === '\`') {
		parent.postMessage({ type: 'CLOSE_BLOB_GAME' }, '*');
	}
});
window.open = function(url) {
	if (!url) return null;
	location.href = url;
	return null;
};
<\/script>
			`;

			html = html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}${injector}`);

			const blob = new Blob([html], { type: 'text/html' });
			blobUrl = URL.createObjectURL(blob);
			loadingDiv.remove();

			overlay = document.createElement('div');
			overlay.style.cssText = `
				position: fixed;
				inset: 0;
				background: #000;
				z-index: 999999;
			`;

			const iframe = document.createElement('iframe');
			iframe.src = blobUrl;
			iframe.style.cssText = `
				width: 100%;
				height: 100%;
				border: none;
			`;
			iframe.tabIndex = -1;
			setTimeout(() => {
				iframe.focus();
				iframe.contentWindow?.focus();
			}, 50);

			// Exit button (drag + click to close)
			exitBtn = document.createElement('div');
			exitBtn.textContent = 'Exit';
			exitBtn.style.cssText = `
				position: fixed;
				left: 12px;
				bottom: 12px;
				z-index: 1000000;
				padding: 8px 14px;
				font-size: 14px;
				background: rgba(0,0,0,0.35);
				color: white;
				border: 1px solid rgba(255,255,255,0.25);
				border-radius: 6px;
				cursor: grab;
				user-select: none;
				opacity: 0.4;
				transition: opacity 0.2s, background 0.2s;
			`;

			exitBtn.onmouseenter = () => {
				exitBtn.style.opacity = '1';
				exitBtn.style.background = 'rgba(0,0,0,0.65)';
			};
			exitBtn.onmouseleave = () => {
				exitBtn.style.opacity = '0.4';
				exitBtn.style.background = 'rgba(0,0,0,0.35)';
			};

			let dragging = false;
			let moved = false;
			let startX = 0, startY = 0, offsetX = 0, offsetY = 0;

			exitBtn.addEventListener('mousedown', e => {
				dragging = true;
				moved = false;
				startX = e.clientX;
				startY = e.clientY;
				const rect = exitBtn.getBoundingClientRect();
				offsetX = e.clientX - rect.left;
				offsetY = e.clientY - rect.top;
				exitBtn.style.cursor = 'grabbing';
				exitBtn.style.pointerEvents = 'auto';
				e.preventDefault();
			});

			document.addEventListener('mousemove', e => {
				if (!dragging) return;
				const dx = Math.abs(e.clientX - startX);
				const dy = Math.abs(e.clientY - startY);
				if (dx > 4 || dy > 4) moved = true;
				exitBtn.style.left = (e.clientX - offsetX) + 'px';
				exitBtn.style.top = (e.clientY - offsetY) + 'px';
				exitBtn.style.bottom = 'auto';
			});

			document.addEventListener('mouseup', () => {
				if (!dragging) return;
				dragging = false;
				exitBtn.style.cursor = 'grab';
				exitBtn.style.pointerEvents = 'auto';
			});

			exitBtn.addEventListener('click', e => {
				if (moved) {
					e.preventDefault();
					e.stopPropagation();
					return;
				}
				closeGame();
			});

			const closeGame = () => {
				try { document.exitFullscreen?.(); document.pointerLockElement && document.exitPointerLock(); } catch {}
				URL.revokeObjectURL(blobUrl);
				overlay.remove();
				exitBtn.remove();
				window.removeEventListener('message', msgHandler);
				document.removeEventListener('keydown', keyHandler);
			};

			const keyHandler = e => {
				if (e.key === '`') closeGame();
			};

			const msgHandler = e => {
				if (e.data && e.data.type === 'CLOSE_BLOB_GAME') closeGame();
			};

			document.addEventListener('keydown', keyHandler, true);
			window.addEventListener('message', msgHandler);

			overlay.appendChild(iframe);
			document.body.appendChild(overlay);
			document.body.appendChild(exitBtn);

		} catch (error) {
			console.error('Error loading page:', error);
			alert('Failed to load page.');
			loadingDiv.remove();
		}
	}
})();
</script>
</body>
</html>
